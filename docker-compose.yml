# Local development services. Start with `npm run docker:up`, stop with `npm run docker:down`.
# Images are pinned by tag AND digest (roadmap 10.2 "pin base images"). Update deliberately, in a chore PR.
# Ports and credentials come from .env (copy .env.example). Defaults below match .env.example.

name: erp

services:
  postgres:
    image: postgres:16.16-alpine@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_owner_dev}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      # Used by docker/postgres/init/01-app-role.sh to create the non-superuser application role.
      APP_DB_USER: ${APP_DB_USER:-erp_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-erp_app_dev}
      # Used by docker/postgres/init/02-provisioner-role.sh (ADR 0008 provisioning role).
      PROVISIONER_DB_USER: ${PROVISIONER_DB_USER:-erp_provisioner}
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD:-erp_provisioner_dev}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO no longer publishes community images on Docker Hub (minio/minio was removed).
  # Chainguard's free image only offers `latest`, so it is pinned by digest. See docs/adr/0002.
  minio:
    image: cgr.dev/chainguard/minio@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-erp_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-erp_minio_dev}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  minio-data:
